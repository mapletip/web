name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Local Turborepo remote-cache server backed by the GitHub Actions
      # cache; exports TURBO_API/TURBO_TOKEN/TURBO_TEAM for later steps.
      - name: Turborepo remote cache
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1
        with:
          use-relative-cache-path: true

      - name: Format check, lint, typecheck, build, build Storybook
        run: pnpm turbo run format:check:root lint typecheck build build-storybook

      - name: Upload Storybook
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: storybook
          path: packages/component-library/storybook-static
          retention-days: 14

  container:
    name: Container (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build image
        run: docker build --tag mapletip-web:${{ matrix.arch }} .

      - name: Smoke test
        run: |
          docker run --detach --name web \
            --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            --user 1000:1000 -e PORT=8087 -p 18087:8087 \
            mapletip-web:${{ matrix.arch }}
          trap 'docker logs web; docker rm -f web' EXIT

          for attempt in $(seq 1 30); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18087/api/healthz)" = 200 ]; then
              break
            fi
            sleep 1
          done

          test "$(curl -s http://127.0.0.1:18087/api/healthz)" = ok
          curl -s -D /tmp/health.headers -o /dev/null http://127.0.0.1:18087/api/healthz
          grep -qi '^cache-control: no-store' /tmp/health.headers
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18087/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18087/nope)" = 404

          asset=$(curl -s http://127.0.0.1:18087/ | grep -o '/assets/[^"]*\.js' | head -1)
          test -n "$asset"
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:18087$asset")" = 200

          docker stop --timeout 10 web
          test "$(docker inspect --format '{{.State.ExitCode}}' web)" = 0

  playwright-version:
    name: Resolve Playwright version
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: pnpm-workspace.yaml
          sparse-checkout-cone-mode: false

      # The container image must match the playwright client exactly, so
      # derive its tag from the catalog pin instead of hardcoding it.
      - name: Read catalog pin
        id: version
        run: echo "version=$(yq '.catalog.playwright' pnpm-workspace.yaml)" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: playwright-version
    runs-on: ubuntu-26.04
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-resolute
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Local Turborepo remote-cache server backed by the GitHub Actions
      # cache; exports TURBO_API/TURBO_TOKEN/TURBO_TEAM for later steps.
      - name: Turborepo remote cache
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1
        with:
          use-relative-cache-path: true

      - name: Test (config smoke, unit + Storybook browser tests)
        run: pnpm turbo run test

  visual:
    name: Visual regression
    needs: playwright-version
    runs-on: ubuntu-26.04
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-resolute
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Read-only token, no secrets, no `pull_request_target`: fork PRs compare
      # committed baselines only. `test:visual` passes `--update=none` and the
      # config rejects update flags in CI, so a missing or different baseline
      # fails instead of being written.
      - name: Visual regression tests
        run: pnpm --filter @mapletip/component-library test:visual

      - name: Upload visual diff artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: visual-regression-report
          path: packages/component-library/.vitest/attachments
          retention-days: 5
          if-no-files-found: ignore
