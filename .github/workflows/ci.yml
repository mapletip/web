name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Local Turborepo remote-cache server backed by the GitHub Actions
      # cache; exports TURBO_API/TURBO_TOKEN/TURBO_TEAM for later steps.
      - name: Turborepo remote cache
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1
        with:
          use-relative-cache-path: true

      - name: Format check, lint, typecheck, build Storybook
        run: pnpm turbo run format:check lint check-types build-storybook

      - name: Upload Storybook
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: storybook
          path: packages/component-library/storybook-static
          retention-days: 14

  playwright-version:
    name: Resolve Playwright version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: pnpm-workspace.yaml
          sparse-checkout-cone-mode: false

      # The container image must match the playwright client exactly, so
      # derive its tag from the catalog pin instead of hardcoding it.
      - name: Read catalog pin
        id: version
        run: echo "version=$(yq '.catalog.playwright' pnpm-workspace.yaml)" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: playwright-version
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Local Turborepo remote-cache server backed by the GitHub Actions
      # cache; exports TURBO_API/TURBO_TOKEN/TURBO_TEAM for later steps.
      - name: Turborepo remote cache
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1
        with:
          use-relative-cache-path: true

      - name: Test (config smoke, unit + Storybook browser tests)
        run: pnpm turbo run test
