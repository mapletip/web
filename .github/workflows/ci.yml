name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Local Turborepo remote-cache server backed by the GitHub Actions
      # cache; exports TURBO_API/TURBO_TOKEN/TURBO_TEAM for later steps.
      - name: Turborepo remote cache
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1
        with:
          use-relative-cache-path: true

      - name: Format check, lint, typecheck, build, build Storybook
        run: pnpm turbo run format:check:root lint typecheck build build-storybook

      - name: Upload Storybook
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: storybook
          path: packages/component-library/storybook-static
          retention-days: 14

  container:
    name: Smoke Test Container (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build image
        run: docker build --tag mapletip-web:${{ matrix.arch }} .

      - name: Smoke test
        run: scripts/ci/smoke-test.sh mapletip-web:${{ matrix.arch }}

  playwright-version:
    name: Resolve Playwright version
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: pnpm-workspace.yaml
          sparse-checkout-cone-mode: false

      # The container image must match the playwright client exactly, so
      # derive its tag from the catalog pin instead of hardcoding it.
      - name: Read catalog pin
        id: version
        run: echo "version=$(yq '.catalog.playwright' pnpm-workspace.yaml)" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: playwright-version
    runs-on: ubuntu-26.04
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-resolute
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Local Turborepo remote-cache server backed by the GitHub Actions
      # cache; exports TURBO_API/TURBO_TOKEN/TURBO_TEAM for later steps.
      - name: Turborepo remote cache
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1
        with:
          use-relative-cache-path: true

      - name: Test (config smoke, unit + Storybook browser tests)
        run: pnpm turbo run test

  visual:
    name: Visual regression
    needs: playwright-version
    runs-on: ubuntu-26.04
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-resolute
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Read-only token, no secrets, no `pull_request_target`: fork PRs compare
      # committed baselines only. `test:visual` passes `--update=none` and the
      # config rejects update flags in CI, so a missing or different baseline
      # fails instead of being written.
      - name: Visual regression tests
        run: pnpm --filter @mapletip/component-library test:visual

      - name: Upload visual diff artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: visual-regression-report
          path: packages/component-library/.vitest/attachments
          retention-days: 5
          if-no-files-found: ignore

  # Publishing only runs for canonical main pushes that passed every gate
  # above; pull requests never reach these jobs and never hold packages:write
  # or id-token:write.
  publish-amd64:
    name: Publish image (amd64)
    needs: [validate, test, visual]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-image.yml
    with:
      arch: amd64
      runner: ubuntu-26.04

  publish-arm64:
    name: Publish image (arm64)
    needs: [validate, test, visual]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-image.yml
    with:
      arch: arm64
      runner: ubuntu-26.04-arm

  publish-index:
    name: Assemble multiarch index
    needs: [publish-amd64, publish-arm64]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.index.outputs.digest }}
    env:
      AMD64_DIGEST: ${{ needs.publish-amd64.outputs.digest }}
      ARM64_DIGEST: ${{ needs.publish-arm64.outputs.digest }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Assembles the index from the two already-verified per-platform
      # digests only (never a mutable tag), then re-reads it back from the
      # registry to confirm the descriptors it actually contains match.
      - name: Assemble and verify index
        id: index
        run: |
          set -euo pipefail
          tag="sha-${GITHUB_SHA:0:12}"

          docker buildx imagetools create \
            --tag "ghcr.io/mapletip/web:${tag}" \
            --annotation "index:org.opencontainers.image.revision=${GITHUB_SHA}" \
            "ghcr.io/mapletip/web@${AMD64_DIGEST}" \
            "ghcr.io/mapletip/web@${ARM64_DIGEST}"

          inspect=$(docker buildx imagetools inspect "ghcr.io/mapletip/web:${tag}" --raw)
          digest=$(docker buildx imagetools inspect "ghcr.io/mapletip/web:${tag}" --format '{{json .Manifest.digest}}' | tr -d '"')

          platforms=$(echo "$inspect" | jq -r '.manifests[].platform.architecture' | sort | tr '\n' ' ')
          test "$platforms" = "amd64 arm64 "

          amd64_from_index=$(echo "$inspect" | jq -r '.manifests[] | select(.platform.architecture=="amd64") | .digest')
          arm64_from_index=$(echo "$inspect" | jq -r '.manifests[] | select(.platform.architecture=="arm64") | .digest')
          test "$amd64_from_index" = "$AMD64_DIGEST"
          test "$arm64_from_index" = "$ARM64_DIGEST"

          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

  release:
    name: Sign, verify and promote release
    needs: [publish-index]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE_DIGEST: ${{ needs.publish-index.outputs.digest }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Install oras
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Install flux
        uses: fluxcd/flux2/action@03cd91fc037a0004d59c196777c5fdf2f5dc3b9d # v2.10.0

      # Only the Kustomization + single-key ConfigMap Flux's existing
      # consumer contract expects; nothing else is permitted into this
      # payload.
      - name: Generate restricted release payload
        run: |
          set -euo pipefail
          mkdir -p release
          cat > release/configmap.yaml <<EOF
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: web-release
            namespace: flux-system
          data:
            WEB_IMAGE: ghcr.io/mapletip/web@${IMAGE_DIGEST}
          EOF
          cat > release/kustomization.yaml <<EOF
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          resources:
            - configmap.yaml
          EOF

      # Phase 1: publish an unselectable candidate. Its tag never matches
      # the `0.<run>.<attempt>` production pattern, so Flux cannot select it
      # before verification below completes.
      - name: Push candidate release artifact
        id: candidate
        run: |
          set -euo pipefail
          candidate_tag="candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          digest=$(flux push artifact "oci://ghcr.io/mapletip/web:${candidate_tag}" \
            --path=./release \
            --source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --revision="${GITHUB_REF_NAME}@sha1:${GITHUB_SHA}" \
            --output json | jq -r '.digest')
          echo "tag=${candidate_tag}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # Phase 2: sign the candidate by digest with keyless GitHub OIDC.
      - name: Sign candidate artifact by digest
        run: cosign sign --yes "ghcr.io/mapletip/web@${{ steps.candidate.outputs.digest }}"

      # Phase 3: drop all registry credentials and independently verify the
      # signature's actual certificate identity/issuer and the payload's
      # anonymous retrievability, rather than assuming the signer matches
      # what we asked for.
      - name: Log out of GHCR
        run: docker logout ghcr.io

      - name: Verify signature identity and source revision
        run: |
          set -euo pipefail
          cosign verify "ghcr.io/mapletip/web@${{ steps.candidate.outputs.digest }}" \
            --certificate-identity-regexp '^https://github\.com/mapletip/web/\.github/workflows/ci\.yml@refs/heads/main$' \
            --certificate-oidc-issuer-regexp '^https://token\.actions\.githubusercontent\.com$' \
            --output json > verify.json

          issuer=$(jq -r '.[0].optional.Issuer' verify.json)
          subject=$(jq -r '.[0].optional.Subject' verify.json)
          test "$issuer" = "https://token.actions.githubusercontent.com"
          test "$subject" = "https://github.com/mapletip/web/.github/workflows/ci.yml@refs/heads/main"

      - name: Verify anonymous payload matches expected release
        run: |
          set -euo pipefail
          rm -rf verify && mkdir verify
          flux pull artifact "oci://ghcr.io/mapletip/web@${{ steps.candidate.outputs.digest }}" --output ./verify
          diff -r release verify

      - name: Verify anonymous source revision metadata
        run: |
          set -euo pipefail
          revision=$(oras manifest fetch "ghcr.io/mapletip/web@${{ steps.candidate.outputs.digest }}" \
            | jq -r '.annotations["org.opencontainers.image.revision"]')
          test "$revision" = "${GITHUB_REF_NAME}@sha1:${GITHUB_SHA}"

      # Phase 4: only after every independent verification above has
      # passed, re-authenticate and attach the selectable production tag.
      # Reruns are idempotent; a tag collision against a different digest
      # fails loudly instead of silently overwriting an accepted release.
      - name: Log back in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach production release tag
        run: |
          set -euo pipefail
          production_tag="0.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          existing_digest=$(oras resolve "ghcr.io/mapletip/web:${production_tag}" 2>/dev/null || true)
          if [ -n "$existing_digest" ]; then
            test "$existing_digest" = "${{ steps.candidate.outputs.digest }}"
            echo "Release ${production_tag} already points at the verified digest; nothing to do."
          else
            oras tag "ghcr.io/mapletip/web@${{ steps.candidate.outputs.digest }}" "${production_tag}"
          fi
