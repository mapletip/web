name: Publish image

on:
  workflow_call:
    inputs:
      arch:
        description: Target architecture (amd64 or arm64)
        required: true
        type: string
      runner:
        description: Native runner label for the target architecture
        required: true
        type: string
    outputs:
      digest:
        description: Digest of the pushed, smoke-tested single-architecture image
        value: ${{ jobs.build.outputs.digest }}

permissions: {}

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/mapletip/web
          tags: type=raw,value=build-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.arch }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # This per-architecture tag is a build-time pointer only; it never
      # matches the `0.<run>.<attempt>` production SemVer pattern Flux
      # selects on, so it cannot become a selectable release by itself.
      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ inputs.arch }}
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Pull pushed digest
        run: docker pull "ghcr.io/mapletip/web@${{ steps.push.outputs.digest }}"

      - name: Smoke test pushed digest
        run: scripts/ci/smoke-test.sh "ghcr.io/mapletip/web@${{ steps.push.outputs.digest }}"

      - name: Verify image revision label
        run: |
          set -euo pipefail
          actual=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "ghcr.io/mapletip/web@${{ steps.push.outputs.digest }}")
          test "$actual" = "${{ github.sha }}"
